name: jarvis-command-center
services:
  hermes-tls:
    image: nginx:1.28-alpine
    container_name: jarvis-hermes-tls
    restart: unless-stopped
    depends_on:
      hermes: {condition: service_healthy}
    networks: [agent-private]
    volumes:
      - ./hermes-tls.conf:/etc/nginx/nginx.conf:ro
      - ../.runtime/tls:/certs:ro
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
  paperclip:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.paperclip
    image: jarvis-command-center:paperclip-2026.1106.0
    container_name: jarvis-paperclip
    init: true
    restart: unless-stopped
    depends_on:
      hermes-tls: {condition: service_started}
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET}
      HOST: 0.0.0.0
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: http://localhost:3100
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip,127.0.0.1
      PAPERCLIP_SECRETS_STRICT_MODE: 'true'
      PAPERCLIP_ANNOUNCEMENTS_ENABLED: 'false'
      NODE_EXTRA_CA_CERTS: /run/jarvis-ca/hermes.crt
    ports: ['127.0.0.1:3100:3100']
    volumes:
      - ../.runtime/paperclip:/paperclip
      - ../.runtime/tls/hermes.crt:/run/jarvis-ca/hermes.crt:ro
    networks: [default, agent-private]
    pids_limit: 2048
    stop_grace_period: 90s
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 60s
    logging:
      options: {max-size: 10m, max-file: '3'}
  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jarvis
    image: jarvis-command-center:hud
    container_name: jarvis-hud
    init: true
    restart: unless-stopped
    environment:
      JARVIS_HUD_TOKEN: ${JARVIS_HUD_TOKEN}
      API_SERVER_KEY: ${API_SERVER_KEY}
      PAPERCLIP_URL: ${PAPERCLIP_URL:-http://paperclip:3100}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID:-}
      PAPERCLIP_PROJECT_ID: ${PAPERCLIP_PROJECT_ID:-}
      PAPERCLIP_AGENT_ID: ${PAPERCLIP_AGENT_ID:-}
      PAPERCLIP_CEO_AGENT_ID: ${PAPERCLIP_CEO_AGENT_ID:-}
      JARVIS_EXECUTION_PROOF_KEY: ${JARVIS_EXECUTION_PROOF_KEY:-}
      JARVIS_OLLAMA_URL: ${JARVIS_OLLAMA_URL:-http://ollama-models:11434}
    networks: [default, agent-private]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../server/config/server.yaml:/app/server/config/server.yaml:ro
      - ../server/logs:/app/server/logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'X-Jarvis-Token':os.environ['JARVIS_HUD_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    logging:
      options: {max-size: 10m, max-file: '3'}
  hermes:
    image: nousresearch/hermes-agent:v0.23.1@sha256:1a355ebc8981a4b72a28f4e47e347ba4f0f172b43dc876e5768d175a07c67b22
    container_name: jarvis-hermes
    restart: unless-stopped
    stop_grace_period: 90s
    command: [gateway, run]
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY}
      HERMES_PAPERCLIP_AGENT_KEY: ${HERMES_PAPERCLIP_AGENT_KEY:-}
      JARVIS_EXECUTION_PROOF_KEY: ${JARVIS_EXECUTION_PROOF_KEY:-}
      HERMES_UID: '1000'
      HERMES_GID: '1000'
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
      HERMES_API_TIMEOUT: '900'
      OPENAI_API_KEY: ollama-local-only
      JARVIS_OLLAMA_URL: http://ollama-models:11434
      HERMES_DASHBOARD: 'false'
    volumes:
      - ../.runtime/hermes:/opt/data
      - ../hermes-plugin/jarvis_readonly:/opt/data/plugins/jarvis_readonly:ro
    networks: [agent-private]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, -c, "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8642/health',headers={'Authorization':'Bearer '+os.environ['API_SERVER_KEY']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 90s
    logging:
      options: {max-size: 10m, max-file: '3'}
  hermes-ceo:
    image: nousresearch/hermes-agent:v0.23.1@sha256:1a355ebc8981a4b72a28f4e47e347ba4f0f172b43dc876e5768d175a07c67b22
    container_name: jarvis-hermes-ceo
    restart: unless-stopped
    stop_grace_period: 90s
    command:
    - gateway
    - run
    environment:
      API_SERVER_KEY: ${API_SERVER_CEO_KEY}
      HERMES_PAPERCLIP_AGENT_KEY: ${HERMES_PAPERCLIP_CEO_KEY:-}
      JARVIS_EXECUTION_PROOF_KEY: ${JARVIS_EXECUTION_PROOF_KEY:-}
      HERMES_UID: '1000'
      HERMES_GID: '1000'
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
      HERMES_API_TIMEOUT: '1800'
      OPENAI_API_KEY: ollama-local-only
      JARVIS_OLLAMA_URL: http://ollama-models:11434
      HERMES_DASHBOARD: 'false'
      JARVIS_AGENT_ROLE: ceo
      JARVIS_PAPERCLIP_AGENT_ID: ${PAPERCLIP_CEO_AGENT_ID:-}
    volumes:
    - ../.runtime/hermes-ceo:/opt/data
    - ../hermes-plugin/jarvis_readonly:/opt/data/plugins/jarvis_readonly:ro
    networks:
    - agent-private
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - /opt/hermes/.venv/bin/python
      - -c
      - import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8642/health',headers={'Authorization':'Bearer
        '+os.environ['API_SERVER_KEY']}); urllib.request.urlopen(r,timeout=3).read()
      interval: 20s
      timeout: 5s
      start_period: 90s
    logging:
      options:
        max-size: 10m
        max-file: '3'
networks:
  agent-private:
    internal: true
