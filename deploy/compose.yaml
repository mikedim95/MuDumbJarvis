name: jarvis-command-center
services:
  jarvis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jarvis
    image: jarvis-command-center:hud
    container_name: jarvis-hud
    init: true
    restart: unless-stopped
    env_file: .env
    networks: [default, agent-private]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../server/config/server.yaml:/app/server/config/server.yaml:ro
      - ../server/logs:/app/server/logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=64m]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'X-Jarvis-Token':os.environ['JARVIS_HUD_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    logging:
      options: {max-size: 10m, max-file: '3'}
  hermes:
    image: nousresearch/hermes-agent:v0.23.1@sha256:1a355ebc8981a4b72a28f4e47e347ba4f0f172b43dc876e5768d175a07c67b22
    container_name: jarvis-hermes
    restart: unless-stopped
    command: [gateway, run]
    env_file: .env
    environment:
      HERMES_UID: '1000'
      HERMES_GID: '1000'
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
      HERMES_API_TIMEOUT: '900'
      OPENAI_API_KEY: ollama-local-only
      JARVIS_OLLAMA_URL: http://ollama-models:11434
      HERMES_DASHBOARD: 'false'
    ports:
      - '127.0.0.1:8642:8642'
    volumes:
      - ../.runtime/hermes:/opt/data
      - ../hermes-plugin/jarvis_readonly:/opt/data/plugins/jarvis_readonly:ro
    networks: [agent-private]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, -c, "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8642/health',headers={'Authorization':'Bearer '+os.environ['API_SERVER_KEY']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 90s
    logging:
      options: {max-size: 10m, max-file: '3'}
networks:
  agent-private:
    internal: true
