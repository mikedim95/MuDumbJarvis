events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8643 ssl;
    ssl_certificate /certs/hermes.crt;
    ssl_certificate_key /certs/hermes.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      set $hermes_upstream http://hermes:8642;
      proxy_pass $hermes_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 950s;
      proxy_send_timeout 950s;
    }
  }
}
