model:
  provider: custom:jarvis-local-ollama
  default: jarvis-hermes:3b
  base_url: http://ollama-models:11434/v1
  context_length: 65536
  ollama_num_ctx: 65536
  streaming: false
providers:
  jarvis-local-ollama:
    api: http://ollama-models:11434/v1
    api_key: ollama-local-only
    extra_body:
      max_tokens: 768
agent:
  max_turns: 8
  gateway_timeout: 900
  disabled_toolsets: [terminal, file, browser, computer_use, code_execution, delegation, skills, cronjob, messaging, kanban]
platform_toolsets:
  cli: [jarvis_readonly]
  api_server: [jarvis_readonly]
tools:
  tool_search:
    enabled: 'off'
plugins:
  enabled: [jarvis_readonly]
hooks:
  output_spill:
    max_chars: 32768
compression:
  enabled: false
memory:
  memory_enabled: false
  user_profile_enabled: false
skills:
  creation_nudge_interval: 0
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: 1
