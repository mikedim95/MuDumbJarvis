Port 2222
ListenAddress 0.0.0.0
HostKey /run/jarvis-ssh/host_key
PidFile /tmp/sshd.pid
AuthorizedKeysFile /run/jarvis-ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AllowUsers employee
StrictModes yes
UsePAM no
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
Subsystem sftp internal-sftp
LogLevel ERROR
